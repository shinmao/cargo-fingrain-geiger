[package]
name = "geiger-resolve"
version = "0.1.0"
edition = "2021"
authors = ["anderejd <rajder@gmail.com>"]
description = "Rustc-based semantic analysis for cargo-geiger unsafe function call tracking"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/rust-secure-code/cargo-geiger"

[dependencies]
serde = { version = "1.0.132", features = ["derive"] }
serde_json = "1.0.79"

[features]
# This crate requires nightly Rust and access to rustc internals
default = []
rustc_private = []

[[bin]]
name = "geiger-rustc"
path = "src/bin/geiger-rustc.rs"
required-features = ["rustc_private"]
